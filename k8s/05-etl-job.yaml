apiVersion: batch/v1
kind: Job
metadata:
  name: etl-historico
  namespace: solarbi
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: etl
          image: solarbi-etl:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: solarbi-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: solarbi-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: solarbi-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"