apiVersion: batch/v1
kind: CronJob
metadata:
  name: simulador
  namespace: solarbi
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: simulador
              image: solarbi-simulator:1.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: solarbi-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: solarbi-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: solarbi-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"