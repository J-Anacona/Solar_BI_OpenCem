# Grafana: provisioning de fuente de datos, tablero y alertas + Deployment + Service.
# Credenciales: PG_USER / PG_PASSWORD vienen del Secret solarbi-secrets (nada en el repo).
# Opcional: agregar GF_ADMIN_USER y GF_ADMIN_PASSWORD al Secret para no usar admin/admin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: solarbi
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: SolarBI PostgreSQL
        uid: solarbi-pg
        type: grafana-postgresql-datasource
        access: proxy
        url: ${PGHOST}:${PGPORT}
        user: ${PG_USER}
        isDefault: true
        editable: false
        jsonData:
          database: ${PGDATABASE}
          sslmode: disable
          timescaledb: false
        secureJsonData:
          password: ${PG_PASSWORD}
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: solarbi
        orgId: 1
        folder: SolarBI
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
  alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: solarbi-operativo
        folder: SolarBI
        interval: 1m
        rules:
          - uid: solarbi-soc-bajo
            title: SoC de bateria bajo
            condition: C
            for: 2m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "SoC de la bateria por debajo de 20 %: revisar carga y consumo"
            labels:
              severity: warning
              kpi: soc
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: solarbi-pg
                model:
                  refId: A
                  datasource:
                    type: grafana-postgresql-datasource
                    uid: solarbi-pg
                  editorMode: code
                  format: time_series
                  rawQuery: true
                  rawSql: "SELECT t.fecha_hora AS time, i.nombre AS metric, t.battsoc::float AS value FROM gold.fact_telemetria t JOIN gold.dim_inversor i USING (inversor_key) WHERE t.fecha_hora >= now() - interval '15 minutes' AND t.battsoc IS NOT NULL ORDER BY 1"
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  refId: B
                  type: reduce
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  refId: C
                  type: threshold
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 20
          - uid: solarbi-sin-datos
            title: Sin datos nuevos de telemetria
            condition: C
            for: 1m
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: "No llegan lecturas hace mas de 900 s (UMBRAL_HUECO_S): revisar simulador o captura"
            labels:
              severity: critical
              kpi: frescura
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: solarbi-pg
                model:
                  refId: A
                  datasource:
                    type: grafana-postgresql-datasource
                    uid: solarbi-pg
                  editorMode: code
                  format: time_series
                  rawQuery: true
                  rawSql: "SELECT now() AS time, (EXTRACT(EPOCH FROM (now() - MAX(fecha_hora))))::float AS value FROM gold.fact_telemetria"
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  refId: B
                  type: reduce
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  refId: C
                  type: threshold
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 900
---
